register("ts219")

-- OpenWrt has no udev by-path links; identify the GPIO input device by name.
for index = 0, 15 do
	local f = io.open("/sys/class/input/event" .. index .. "/device/name")
	if f then
		local name = f:read("*l")
		f:close()
		if name == "gpio-keys" then
			register("evdev", "/dev/input/event" .. index,
				408, "restart_button", 133, "media_button")
			break
		end
	end
end

register("system-status")

buzzer = true

has_fan = 1

piccmd("statusled", "greenon")
piccmd("powerled", "on")
piccmd("usbled", "off")

function system_status( status )
	logprint("System status: "..status)
	if status == "start" then
		piccmd("statusled", "greenon")
		piccmd("powerled", "on")
		piccmd("usbled", "off")
		if buzzer then piccmd("buzzer", "short") end
	elseif status == "stop" then
		piccmd("statusled", "redon")
		piccmd("powerled", "1hz")
		if buzzer then piccmd("buzzer", "short") end
	else
		logprint("Unknown system status")
	end
end

function power_button( time )
	logprint("ts221: power button event (time=" .. time .. ") -> poweroff")
	os.execute("/sbin/poweroff")
end

function restart_button( time )
	logprint("ts221: restart button event (time=" .. time .. ")")
	os.execute("/sbin/reboot")
end

function media_button( time )
	piccmd("usbled", "8hz")
end

fanfail = 0

function fan_error( fan_no  )
	if fan_no > has_fan then
		return
	end
	fanfail = fanfail + 1
	if fanfail == 3 then
		logprint("ts221: fan error, num:"..fan_no)
		piccmd("statusled", "red2hz")
		piccmd("buzzer", "long")
	elseif fanfail == 10 then
		fanfail = 0
	end
end

function fan_normal( fan_no )
	if fan_no > has_fan then
		return
	end
	piccmd("statusled", "greenon")
	fanfail = 0
end

function esata_event( state )
	logprint("ts221: esata_event "..state)
end

function lan_link( up )
	logprint("ts221: lan_link "..up)
end

last_fan_setting = nil

function setfan( temp, speed )
	if ( ( not last_fan_setting ) or
	     ( last_fan_setting ~= speed ) ) then
		logprint(string.format("ts221: temperature %d setting fan to \"%s\"", temp, speed))
	end
	piccmd("fanspeed", speed)
	last_fan_setting = speed
end

hdd_refresh = 0
hdd1_temp = nil
hdd2_temp = nil

local function read_num( path )
	local f = io.open(path, "r")
	if not f then return nil end
	local s = f:read("*l")
	f:close()
	return s and tonumber(s) or nil
end

local function read_soc_temp()
	local v = read_num("/sys/class/thermal/thermal_zone0/temp")
	if v then return math.floor(v / 1000) end
	return nil
end

local function smart_temp( dev )
	os.execute("smartctl -A " .. dev ..
		   " 2>/dev/null | awk '/^194/ {print $10; exit}' > /tmp/ts221-hdd.temp")
	return read_num("/tmp/ts221-hdd.temp")
end

function temp( temp )
	hdd_refresh = hdd_refresh + 1
	if hdd_refresh >= 12 then
		hdd_refresh = 0
		hdd1_temp = smart_temp("/dev/sda")
		hdd2_temp = smart_temp("/dev/sdb")
		logprint(string.format(
			"ts221: temps pic=%d soc=%s hdd1=%s hdd2=%s",
			temp, tostring(read_soc_temp()),
			tostring(hdd1_temp), tostring(hdd2_temp)))
	end

	local eff = temp
	local src = "pic"
	local soc = read_soc_temp()
	if soc and soc > eff then eff, src = soc, "soc" end
	if hdd1_temp and hdd1_temp > eff then eff, src = hdd1_temp, "hdd1" end
	if hdd2_temp and hdd2_temp > eff then eff, src = hdd2_temp, "hdd2" end

	if last_fan_setting == "full" then
		if eff < 61 then
			setfan(eff, "high")
		end
	elseif last_fan_setting == "high" then
		if eff > 65 then
			setfan(eff, "full")
		elseif eff < 56 then
			setfan(eff, "medium")
		end
	elseif last_fan_setting == "medium" then
		if eff > 61 then
			setfan(eff, "high")
		elseif eff < 51 then
			setfan(eff, "low")
		end
	elseif last_fan_setting == "low" then
		if eff > 56 then
			setfan(eff, "medium")
		elseif eff < 46 then
			setfan(eff, "silence")
		end
	elseif last_fan_setting == "silence" then
		if eff > 50 then
			setfan(eff, "low")
		end
	else
		if eff > 65 then
			setfan(eff, "full")
		elseif eff > 61 then
			setfan(eff, "high")
		elseif eff > 56 then
			setfan(eff, "medium")
		elseif eff > 50 then
			setfan(eff, "low")
		else
			setfan(eff, "silence")
		end
	end
end
